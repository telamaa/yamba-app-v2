<svg viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Reseau de corridors (D91). La version precedente posait une GRILLE pleine
    page derriere des courbes en pointilles et des points : elle lisait
    « graphique de tableau de bord », jamais « colis en voyage ». La grille
    sort, un colis prend la route principale, et les noeuds gardent le dessin
    des deux autres visuels (pastille pleine + coeur blanc).
  -->
  <path d="M 50 130 Q 110 40, 175 75" stroke="#FF9900" stroke-width="2.4" stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>
  <path d="M 50 130 Q 130 155, 270 90" stroke="#0F766E" stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 175 75 Q 220 50, 270 90" stroke="#0F766E" stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-linecap="round" opacity="0.75"/>

  <circle cx="50" cy="130" r="11" fill="#FF9900"/>
  <circle cx="50" cy="130" r="4" fill="#fff"/>
  <circle cx="175" cy="75" r="11" fill="#0F766E"/>
  <circle cx="175" cy="75" r="4" fill="#fff"/>
  <circle cx="270" cy="90" r="11" fill="#FF9900"/>
  <circle cx="270" cy="90" r="4" fill="#fff"/>

  <!-- Le colis, pose sur le corridor principal : le sujet de la page. -->
  <g transform="translate(94, 62) rotate(-16)">
    <rect x="0" y="0" width="34" height="26" rx="4" fill="#FF9900" stroke="#0F172A" stroke-width="0.8"/>
    <line x1="0" y1="9.5" x2="34" y2="9.5" stroke="#0F172A" stroke-width="0.8"/>
    <line x1="17" y1="0" x2="17" y2="9.5" stroke="#0F172A" stroke-width="0.8"/>
    <rect x="12" y="3.5" width="10" height="3.5" rx="0.6" fill="#0F172A" opacity="0.4"/>
  </g>
</svg>
