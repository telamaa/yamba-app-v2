name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: user-ui
            tsconfig: apps/user-ui
          - project: admin-ui
            tsconfig: apps/admin-ui
          - project: trip-service
            tsconfig: apps/trip-service/tsconfig.app.json
          - project: auth-service
            tsconfig: apps/auth-service/tsconfig.app.json
          - project: api-gateway
            tsconfig: apps/api-gateway/tsconfig.app.json
          - project: deal-service
            tsconfig: apps/deal-service/tsconfig.app.json
          - project: notification-service
            tsconfig: apps/notification-service/tsconfig.app.json
          - project: message-service
            tsconfig: apps/message-service/tsconfig.app.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm (meme version que le poste qui genere le lock)
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit --project ${{ matrix.tsconfig }}

  contracts:
    name: Contrats OpenAPI (generate + diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm (meme version que le poste qui genere le lock)
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Regenerate openapi.json
        run: npm run generate:openapi

      - name: openapi.json est a jour (DoD chantier 0)
        run: |
          if ! git diff --exit-code apps/trip-service/openapi.json apps/deal-service/openapi.json apps/notification-service/openapi.json apps/message-service/openapi.json apps/auth-service/openapi.json; then
            echo "::error::openapi.json n'est pas a jour. Lancer 'npm run generate:openapi' et commiter le resultat."
            exit 1
          fi

  tests:
    name: Tests unitaires (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: trip-service
            nx_project: "@yamba-app/trip-service"
          - project: auth-service
            nx_project: "auth-service"
          - project: deal-service
            nx_project: "@yamba-app/deal-service"
          - project: notification-service
            nx_project: "@yamba-app/notification-service"
          - project: message-service
            nx_project: "@yamba-app/message-service"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm (meme version que le poste qui genere le lock)
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npx nx test ${{ matrix.nx_project }} --ci

  build-services:
    # #174 : un service peut etre type et teste et ne pas demarrer (src/assets absent,
    # alias webpack manquant...). Le build webpack des six services est ce que `nx serve`
    # et le deploiement executent — la CI le fait donc aussi (un seul check, 20 s en local).
    name: Build des services (webpack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm (meme version que le poste qui genere le lock)
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (six services)
        run: npx nx run-many -t build --projects=@yamba-app/api-gateway,auth-service,@yamba-app/trip-service,@yamba-app/deal-service,@yamba-app/notification-service,@yamba-app/message-service --skip-nx-cache

  i18n-messages:
    name: i18n messages (parse + miroir FR/EN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check messages
        run: node scripts/check-i18n-messages.mjs

  no-secrets:
    name: Anti-fuite (fichiers sensibles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: No tracked env/secret files
        run: |
          MATCHES=$(git ls-files | grep -iE '(^|/)\.env($|\.)|secret|\.pem$|\.key$' | grep -vE '\.(example|template)$' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Fichiers sensibles trackes dans git :"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK - aucun fichier sensible tracke."
