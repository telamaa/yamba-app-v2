name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [user-ui, trip-service, auth-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm (meme version que le poste qui genere le lock)
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit --project apps/${{ matrix.project }}

  i18n-messages:
    name: i18n messages (parse + miroir FR/EN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check messages
        run: node scripts/check-i18n-messages.mjs

  no-secrets:
    name: Anti-fuite (fichiers sensibles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No tracked env/secret files
        run: |
          MATCHES=$(git ls-files | grep -iE '(^|/)\.env($|\.)|secret|\.pem$|\.key$' | grep -vE '\.(example|template)$' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Fichiers sensibles trackes dans git :"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK - aucun fichier sensible tracke."
